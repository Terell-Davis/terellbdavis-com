baseURL = "/"
title = "Terell Davis - Blogging Site"
theme = "hydrogen-hugo"
timeZone = "EST"
summaryLength = "10"
googleAnalytics = ""
disableLanguages = ["fr"]
hasCJKLanguage = false
[services.disqus]
shortname = "themefisher-template"
[outputs]
home = ["HTML","RSS","WebAppManifest"]
[imaging]
quality = 90
[caches.images]
dir = ":resourceDir/_gen"
maxAge = "720h"
[caches.assets]
dir = ":resourceDir/_gen"
maxAge = "720h"
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
style = "dracula"
[mediaTypes."application/manifest+json"]
suffixes = ["webmanifest"]
[mediaTypes."text/netlify"]
delimiter = ""
suffixes = [""]
[outputFormats.WebAppManifest]
mediaType = "application/manifest+json"
rel = "manifest"
